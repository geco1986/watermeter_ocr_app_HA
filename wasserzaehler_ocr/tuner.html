<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<base href="./">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wasserzähler – Rotation & Zuschnitt</title>
<link rel="stylesheet" href="app.css">
<script src="app.js"></script>
<style>
  .cols { display:flex; flex-wrap:wrap; gap:20px; }
  .col { flex:1; min-width:300px; }
  .row { display:flex; align-items:center; gap:10px; }
  input[type=range] { flex:1; width:auto; accent-color:var(--accent); }
  .row input[type=number] { width:90px; }
  select { width:auto; }
  .val { min-width:64px; text-align:right; font-variant-numeric:tabular-nums; color:var(--accent2); }
  .preview { text-align:center; }
  .preview img { max-width:100%; border:1px solid var(--border); border-radius:var(--radius-sm); background:#000; }
  .src img { max-width:100%; border:1px solid var(--border); border-radius:var(--radius-sm); }
</style>
</head>
<body>
<div id="appbar"></div>
<div class="wrap">
  <div class="page-head">
    <h2 data-i18n="tun.title"></h2>
    <p data-i18n="tun.sub"></p>
  </div>
  <div class="cols">
  <div class="col">
    <div class="card">
      <h2><svg class="icon"><use href="#ic-image"></use></svg><span data-i18n="tun.source"></span></h2>
      <div class="src"><img id="srcimg" alt="Quellbild" src="tuner/source.jpg?ts=0"></div>
      <label for="led_brightness" style="display:block;font-size:13px;margin:12px 0 5px;">
        LED-Helligkeit: <span id="led_val">100</span>% <span class="muted">(0 = ohne Vorgabe)</span></label>
      <input type="range" id="led_brightness" min="0" max="100" step="5" value="100" style="width:100%;">
      <div class="btns">
        <button id="fetchBtn"><svg class="icon"><use href="#ic-camera"></use></svg><span data-i18n="btn.fetchImg"></span></button>
      </div>
      <div class="hint">Holt ein frisches Bild (mit Lampe in dieser Helligkeit, wie im echten Ablauf). Dauert kurz.</div>
    </div>

    <div class="card">
      <h2><svg class="icon"><use href="#ic-tune"></use></svg><span data-i18n="tun.settings"></span></h2>
      <label>Drehwinkel <span class="val" id="v_angle"></span></label>
      <div class="row">
        <input type="range" id="angle" min="-180" max="180" step="1">
        <input type="number" id="angle_n" step="1">
      </div>

      <label>Füllfarbe der Ecken</label>
      <select id="fill">
        <option value="black">schwarz</option>
        <option value="white">weiß</option>
      </select>

      <label>Zuschnitt oben <span class="val" id="v_top"></span></label>
      <div class="row"><input type="range" id="crop_top" min="0" max="1000" step="5">
        <input type="number" id="crop_top_n" step="5"></div>

      <label>Zuschnitt unten <span class="val" id="v_bottom"></span></label>
      <div class="row"><input type="range" id="crop_bottom" min="0" max="1000" step="5">
        <input type="number" id="crop_bottom_n" step="5"></div>

      <label>Zuschnitt links <span class="val" id="v_left"></span></label>
      <div class="row"><input type="range" id="crop_left" min="0" max="1000" step="5">
        <input type="number" id="crop_left_n" step="5"></div>

      <label>Zuschnitt rechts <span class="val" id="v_right"></span></label>
      <div class="row"><input type="range" id="crop_right" min="0" max="1000" step="5">
        <input type="number" id="crop_right_n" step="5"></div>

      <label>JPEG-Qualität <span class="val" id="v_q"></span></label>
      <div class="row"><input type="range" id="q" min="1" max="95" step="1">
        <input type="number" id="q_n" step="1"></div>
    </div>
  </div>

  <div class="col">
    <div class="card">
      <h2><svg class="icon"><use href="#ic-crop"></use></svg><span data-i18n="tun.preview"></span></h2>
      <div class="preview"><img id="preview" alt="Vorschau"></div>
      <div class="status" id="pstatus"></div>
    </div>

    <div class="card">
      <h2><svg class="icon"><use href="#ic-save"></use></svg><span data-i18n="common.save"></span></h2>
      <div>Aktuelle Werte:</div>
      <div class="hint" id="curvals"></div>
      <div class="btns">
        <button id="saveBtn"><svg class="icon"><use href="#ic-save"></use></svg><span data-i18n="btn.saveOverride"></span></button>
        <button id="resetBtn" class="ghost"><svg class="icon"><use href="#ic-refresh"></use></svg><span data-i18n="btn.resetConfig"></span></button>
      </div>
      <div class="status" id="sstatus"></div>
      <div class="hint">Gespeicherte Werte gelten sofort für alle nächsten Ablesungen,
        bis du zurücksetzt.</div>
    </div>
  </div>
</div>
</div>

<script>
const ids = ["angle","crop_top","crop_bottom","crop_left","crop_right"];
const el = id => document.getElementById(id);

function params() {
  return {
    rotate_angle: parseFloat(el("angle").value),
    fill_color: el("fill").value,
    crop_top: parseInt(el("crop_top").value),
    crop_bottom: parseInt(el("crop_bottom").value),
    crop_left: parseInt(el("crop_left").value),
    crop_right: parseInt(el("crop_right").value),
    jpeg_quality: parseInt(el("q").value),
  };
}

function syncLabels() {
  el("v_angle").textContent = el("angle").value + "°";
  el("v_top").textContent = el("crop_top").value;
  el("v_bottom").textContent = el("crop_bottom").value;
  el("v_left").textContent = el("crop_left").value;
  el("v_right").textContent = el("crop_right").value;
  el("v_q").textContent = el("q").value;
  const p = params();
  el("curvals").textContent =
    `Winkel ${p.rotate_angle}°, Ecken ${p.fill_color}, ` +
    `oben ${p.crop_top}, unten ${p.crop_bottom}, links ${p.crop_left}, ` +
    `rechts ${p.crop_right}, Qualität ${p.jpeg_quality}`;
}

let previewTimer = null;
function updatePreview() {
  syncLabels();
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => {
    const p = params();
    const q = new URLSearchParams(p).toString();
    const st = el("pstatus");
    st.className = "status"; st.textContent = "Rendere…";
    const img = el("preview");
    img.onload = () => { st.className="status ok"; st.textContent =
      `OK (${img.naturalWidth}×${img.naturalHeight} px)`; };
    img.onerror = () => { st.className="status err";
      st.textContent = "Fehler – Schnittwerte passen evtl. nicht ins Bild."; };
    img.src = "tuner/preview.jpg?" + q + "&ts=" + Date.now();
  }, 200);
}

// Slider <-> Zahlenfeld koppeln
function link(slider, number) {
  const s = el(slider), n = el(number);
  s.addEventListener("input", () => { n.value = s.value; updatePreview(); });
  n.addEventListener("input", () => { s.value = n.value; updatePreview(); });
}
link("angle","angle_n"); link("crop_top","crop_top_n");
link("crop_bottom","crop_bottom_n"); link("crop_left","crop_left_n");
link("crop_right","crop_right_n"); link("q","q_n");
el("fill").addEventListener("change", updatePreview);

// Startwerte laden
fetch("tuner/current").then(r=>r.json()).then(v => {
  el("angle").value = v.rotate_angle; el("angle_n").value = v.rotate_angle;
  el("fill").value = v.fill_color;
  el("crop_top").value = v.crop_top; el("crop_top_n").value = v.crop_top;
  el("crop_bottom").value = v.crop_bottom; el("crop_bottom_n").value = v.crop_bottom;
  el("crop_left").value = v.crop_left; el("crop_left_n").value = v.crop_left;
  el("crop_right").value = v.crop_right; el("crop_right_n").value = v.crop_right;
  el("q").value = v.jpeg_quality; el("q_n").value = v.jpeg_quality;
  updatePreview();
});

// Frisches Bild holen
el("led_brightness").addEventListener("input", () => {
  el("led_val").textContent = el("led_brightness").value;
});
// aktuelle Helligkeit aus den Einstellungen laden
fetch("settings").then(r=>r.json()).then(s => {
  const v = (s.light_brightness === undefined || s.light_brightness === null) ? 100 : s.light_brightness;
  el("led_brightness").value = v; el("led_val").textContent = v;
}).catch(()=>{});

el("fetchBtn").addEventListener("click", () => {
  const b = el("fetchBtn"); b.disabled = true; b.textContent = "Hole Bild…";
  fetch("tuner/fetch_source", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({light_brightness: parseInt(el("led_brightness").value) || 0})}).then(r=>r.json()).then(d => {
    b.disabled = false; b.textContent = "Neues Bild von Kamera holen";
    if (d.ok) { el("srcimg").src = "tuner/source.jpg?ts=" + Date.now(); updatePreview(); }
    else { alert("Fehler: " + (d.error||"unbekannt")); }
  }).catch(e => { b.disabled=false; b.textContent="Neues Bild von Kamera holen";
    alert("Fehler: " + e); });
});

// Speichern
el("saveBtn").addEventListener("click", () => {
  const st = el("sstatus"); st.className="status"; st.textContent="Speichere…";
  fetch("tuner/save", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(params())}).then(r=>r.json()).then(d => {
    if (d.ok) { st.className="status ok"; st.textContent="Gespeichert – gilt ab jetzt."; }
    else { st.className="status err"; st.textContent="Fehler: "+(d.error||""); }
  });
});

// Zurücksetzen
el("resetBtn").addEventListener("click", () => {
  const st = el("sstatus"); st.className="status"; st.textContent="Setze zurück…";
  fetch("tuner/reset", {method:"POST"}).then(r=>r.json()).then(d => {
    st.className="status ok"; st.textContent="Zurückgesetzt – Add-on-Konfig gilt wieder.";
    fetch("tuner/current").then(r=>r.json()).then(v => {
      el("angle").value=v.rotate_angle; el("angle_n").value=v.rotate_angle;
      el("fill").value=v.fill_color;
      el("crop_top").value=v.crop_top; el("crop_top_n").value=v.crop_top;
      el("crop_bottom").value=v.crop_bottom; el("crop_bottom_n").value=v.crop_bottom;
      el("crop_left").value=v.crop_left; el("crop_left_n").value=v.crop_left;
      el("crop_right").value=v.crop_right; el("crop_right_n").value=v.crop_right;
      el("q").value=v.jpeg_quality; el("q_n").value=v.jpeg_quality;
      updatePreview();
    });
  });
});
</script>
</body>
</html>
